# ==============================================================================
#  Build GKI 5.15 (android13-5.15) + BakaSU + SUSFS（内核内 inline hook）
# ==============================================================================
#  BakaSU 是 tiann/KernelSU 的下游分支（Baka-SU/BakaSU）。与另两个工作流的区别：
#    * 根方案用 **BakaSU**，不是 tiann/KernelSU，也不是 KernelSU-Next
#    * SUSFS 走 **内核内 inline hook**：BakaSU 自带 kernel 侧的 SUSFS 胶水
#      （kernel/feature/susfs*、CONFIG_KSU_SUSFS），因此**不需要** simonpunk 的
#      KernelSU 侧补丁 10_enable_susfs_for_ksu.patch
#    * 但内核侧主补丁 **50_add_susfs_in_gki-android13-5.15.patch 仍然必须打**
#      —— BakaSU 的 kernel/Kbuild 在 CONFIG_KSU_SUSFS=y 时会检查
#      $(srctree)/fs/susfs.c 是否存在，不存在直接 $(error) 中止；
#      kernel/tools/inline_hook_check.mk 还会硬性核对 7 个 ksu_handle_* 钩子落点。
#      依据：https://bakasu.org/guide/build（官方文档：「choose the branch that
#      matches your kernel version and apply the kernel-side patches」）
#
#  版本固定（本机 WSL 实测通过的组合，2026-10-16）：
#    * BakaSU = Baka-SU/BakaSU tag **v4.2.0-rc3**
#      (commit 239e1e8871b8fcd51a6e5b3002e0ba522fdd99fb)
#    * susfs4ksu = gitlab simonpunk/susfs4ksu 分支 gki-android13-5.15
#      @ 2ad297356931ba06b4edc0860f42fdd143b02ffd（50_ 补丁 LF md5
#      d8559ba63c8e2c0ff9e41f494d0bbbfe）
#
#  ⚠ 为什么不用 BakaSU 的 main 分支：
#    main 上 kernel/tools/susfs_compat.mk 末尾有一句**无条件**的
#      $(error Please wait susfs update.)
#    也就是上游目前主动禁用了 SUSFS 构建（等 simonpunk 侧更新）。
#    v4.1.0 及更早是旧的扁平 kernel/ 目录结构（无 tools/susfs_compat.mk，
#    也没有 CONFIG_KSU_SUSFS 的新钩子契约），无法按官方方式使用。
#    v4.2.0-rc1/rc2/rc3 三个 tag 才有新结构且放行 SUSFS 构建 —— 故 pin rc3。
#
#  5.15 上下文修法来自 zzh20188/GKI_KernelSU_SUSFS（scripts/susfs_fixes/apply.sh）：
#    本内核带 `#include <trace/hooks/blk.h>`（fs/namespace.c）与
#    `#include <trace/hooks/mm.h>`（fs/proc/task_mmu.c），SUSFS 主补丁上下文对不上，
#    需在打补丁前临时删掉这两行、打完再还原（本内核已有 VMA_PAD_START，无需 vma->vm_end 兼容）。
#
#  装机后还需要 userspace 工具 ksu_susfs 配置 sus_path / sus_mount 等
#  （simonpunk 那边用 NDK 编译，本工作流不构建）。
# ==============================================================================

name: Build GKI 5.15 BakaSU + SUSFS (in-kernel)

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: 'Baka-SU/BakaSU 的 tag/commit（默认 v4.2.0-rc3：实测可过 SUSFS 构建；main 分支被上游主动禁用）'
        required: false
        default: 'v4.2.0-rc3'
      susfs_ref:
        description: 'susfs4ksu 的 commit/分支（默认验证过的 commit）'
        required: false
        default: '2ad297356931ba06b4edc0860f42fdd143b02ffd'
      build_modules:
        description: '是否额外构建内核模块 (make modules)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      ccache_max_size:
        description: 'ccache 容量上限（如 2G / 4G）'
        required: false
        default: '2G'

permissions:
  contents: read

concurrency:
  group: build-gki-bakasu-susfs-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCH: arm64
  ANDROID_VER: android13
  KERNEL_VER: '5.15'
  SUSFS_BRANCH: gki-android13-5.15
  KSU_REF: ${{ inputs.bakasu_ref }}
  SUSFS_REF: ${{ inputs.susfs_ref }}
  BUILD_MODULES: ${{ inputs.build_modules }}
  # 验证过的指纹/固定点；默认 ref 下若对不上直接报错，防止上游悄悄改动
  PATCH_MD5_50: d8559ba63c8e2c0ff9e41f494d0bbbfe
  DEFAULT_SUSFS_REF: 2ad297356931ba06b4edc0860f42fdd143b02ffd
  DEFAULT_KSU_REF: v4.2.0-rc3
  DEFAULT_KSU_SHA: 239e1e8871b8fcd51a6e5b3002e0ba522fdd99fb
  # ---- ccache ----
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: ${{ inputs.ccache_max_size }}
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_COMPILERCHECK: 'content'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_SLOPPINESS: 'pch_defines,time_macros,include_file_mtime,include_file_ctime,file_stat_matches,clang_index_store,gcno_cwd'
  CCACHE_WRAPPER_DIR: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1
          submodules: false   # .gitmodules 里是 KernelSU 子模块，这里由 setup.sh 自己 clone

      - name: Free Disk Space
        run: |
          echo "释放磁盘空间..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Swap
        run: |
          echo "设置 8G swap（LTO 链接阶段容易吃内存）..."
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl wget python3 bc rsync cpio \
            ccache kmod file gzip xz-utils bison flex libssl-dev libelf-dev \
            libncurses-dev build-essential patch

      # ------------------------------------------------------------------
      # Clang：AOSP Clang 14.0.6 / r450784e（android13-5.15 的原生工具链）
      # ------------------------------------------------------------------
      - name: Setup AOSP Clang Toolchain
        run: |
          set -euo pipefail
          mkdir -p clang
          PRIMARY_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz"
          MIRROR_URL="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20260619-release/Clang-14.0.6-20260619.tar.gz"

          echo "[+] 下载 Clang 工具链..."
          rm -f clang.tar.gz
          if ! wget -q --show-progress --timeout=30 --tries=3 "$PRIMARY_URL" -O clang.tar.gz || [ ! -s clang.tar.gz ]; then
            echo "[!] 主源失败，改用镜像..."
            wget -q --show-progress --timeout=30 --tries=3 "$MIRROR_URL" -O clang.tar.gz
          fi
          [ -s clang.tar.gz ] || { echo "::error::clang 压缩包下载失败"; exit 1; }

          tar -xzf clang.tar.gz -C clang/
          rm -f clang.tar.gz

          CLANG_BIN_DIR=""
          for cand in "$PWD/clang/bin" "$PWD/clang"/*/bin; do
            if [ -x "$cand/clang" ]; then CLANG_BIN_DIR="$cand"; break; fi
          done
          [ -n "$CLANG_BIN_DIR" ] || { echo "::error::找不到 clang 可执行文件"; find "$PWD/clang" -maxdepth 3 -type d | head -20; exit 1; }
          "$CLANG_BIN_DIR/clang" --version | grep -q clang || { echo "::error::clang 无法运行"; exit 1; }

          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          "$CLANG_BIN_DIR/clang" --version

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR" "$CCACHE_WRAPPER_DIR"
          CCACHE_BIN="$(command -v ccache)"
          for tool in clang clang++ gcc g++; do
            ln -sf "$CCACHE_BIN" "$CCACHE_WRAPPER_DIR/$tool"
          done
          ccache --version | head -n1
          ccache -M "$CCACHE_MAXSIZE"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-gki515-bakasus-${{ inputs.bakasu_ref }}-${{ hashFiles('kernel/arch/arm64/configs/gki_defconfig') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-gki515-bakasus-${{ inputs.bakasu_ref }}-
            ${{ runner.os }}-ccache-gki515-bakasus-
            ${{ runner.os }}-ccache-gki515-

      # ------------------------------------------------------------------
      # clang 14 适配：ACK Makefile 硬编码 -regalloc-enable-advisor=release，
      # 但 clang-r450784e 里没有 MLGO 模型 → 从 -O1 起每个文件都报
      #   error: Requested regalloc eviction advisor analysis could be created. Using default
      # 必须改成 default（等价于模型加载失败时的回退行为）
      # ------------------------------------------------------------------
      - name: Patch Kernel Makefile (MLGO regalloc advisor)
        working-directory: kernel
        run: |
          set -euo pipefail
          sed -i 's/-mllvm -regalloc-enable-advisor=release/-mllvm -regalloc-enable-advisor=default/g' Makefile
          grep -n "regalloc-enable-advisor" Makefile || { echo "::error::Makefile 里没有 regalloc 参数，上游结构可能变了"; exit 1; }
          if grep -q 'regalloc-enable-advisor=release' Makefile; then
            echo "::error::MLGO 补丁未生效"; exit 1
          fi

      # ------------------------------------------------------------------
      # 集成 BakaSU（官方 setup.sh；必须 pin tag 并断言落点）
      # 注意 setup.sh 里 git checkout 失败时会 `|| echo '[!] Checkout default branch'`
      # 静默退回 main 分支 —— 那就是 SUSFS 被禁用、构建必挂的版本，所以这里必须硬断言 SHA。
      # ------------------------------------------------------------------
      - name: Integrate BakaSU
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "[+] 取 setup.sh (ref=$KSU_REF)"
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/${KSU_REF}/kernel/setup.sh" -o "$RUNNER_TEMP/ksu-setup.sh"
          test -s "$RUNNER_TEMP/ksu-setup.sh" || { echo "::error::setup.sh 下载失败/为空"; exit 1; }
          bash "$RUNNER_TEMP/ksu-setup.sh" "$KSU_REF"

          echo "[+] 硬断言：BakaSU 必须落在 $KSU_REF 对应的 commit"
          ACTUAL="$(git -C KernelSU rev-parse HEAD)"
          if [ "$KSU_REF" = "$DEFAULT_KSU_REF" ]; then
            EXPECTED="$DEFAULT_KSU_SHA"
            echo "   actual=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::BakaSU 未落在 pin 的 commit（setup.sh 的 checkout 会静默退回 main）"
              exit 1
            fi
          else
            echo "::warning::使用自定义 BakaSU ref（$KSU_REF，$ACTUAL），跳过 SHA 固定校验"
          fi

          echo "[+] 校验集成结果"
          test -L drivers/kernelsu || { echo "::error::drivers/kernelsu 符号链接缺失"; exit 1; }
          test -f drivers/kernelsu/Kconfig || { echo "::error::drivers/kernelsu/Kconfig 缺失"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "::error::drivers/Makefile 未注入"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || { echo "::error::drivers/Kconfig 未注入"; exit 1; }

          # upstream 明确禁用 SUSFS 的版本要在这里就失败，而不是等到 make 里 $(error)
          if grep -q 'Please wait susfs update' KernelSU/kernel/tools/susfs_compat.mk; then
            echo "::error::该 BakaSU ref 的 susfs_compat.mk 无条件 \$(error)，SUSFS 不可用；请换用 v4.2.0-rc1/rc2/rc3"
            exit 1
          fi

          git -C KernelSU log -1 --format='commit: %H%ndate:   %ad%nsubject:%s' --date=iso
          {
            echo "KSU_SOURCE=Baka-SU/BakaSU"
            echo "KSU_COMMIT=$(git -C KernelSU rev-parse HEAD)"
            echo "KSU_DESCRIBE=$(git -C KernelSU describe --tags --always 2>/dev/null || echo unknown)"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 取 SUSFS 补丁源（simonpunk/susfs4ksu）并固定版本
      # ------------------------------------------------------------------
      - name: Fetch SUSFS patches
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf susfs4ksu
          git init -q susfs4ksu
          git -C susfs4ksu remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          # 取 200 层深度：既能拿到分支 tip，也能容忍分支前进（pin 的 commit 需要落在窗口内）
          git -C susfs4ksu fetch -q --depth 200 origin "$SUSFS_BRANCH"
          if ! git -C susfs4ksu checkout -q "$SUSFS_REF" 2>/dev/null; then
            echo "[!] pin 的 commit 不在浅克隆窗口内，改为全量取该分支"
            git -C susfs4ksu fetch -q --unshallow origin "$SUSFS_BRANCH" || git -C susfs4ksu fetch -q origin "$SUSFS_BRANCH"
            git -C susfs4ksu checkout -q "$SUSFS_REF"
          fi
          SUSFS_COMMIT="$(git -C susfs4ksu rev-parse HEAD)"
          echo "SUSFS 使用提交: $SUSFS_COMMIT"
          if [ "$SUSFS_COMMIT" != "$SUSFS_REF" ]; then
            echo "::error::SUSFS checkout 结果与 pin 的 ref 不一致"
            exit 1
          fi
          git -C susfs4ksu log -1 --format='date: %ad%nsubject: %s' --date=iso

          P50="susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"
          test -f "$P50" || { echo "::error::找不到 $P50"; exit 1; }

          MD5_50="$(md5sum "$P50" | cut -d' ' -f1)"
          echo "50_ md5 = $MD5_50 (期望 $PATCH_MD5_50)"
          if [ "$SUSFS_COMMIT" = "$DEFAULT_SUSFS_REF" ]; then
            if [ "$MD5_50" != "$PATCH_MD5_50" ]; then
              echo "::error::补丁指纹与验证过的不一致（上游改了补丁），请人工确认"
              exit 1
            fi
          else
            echo "::warning::使用自定义 SUSFS ref，跳过补丁指纹校验（集成步骤仍会断言零 .rej）"
          fi

          {
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "SUSFS_50_MD5=$MD5_50"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 源文件复制 + 内核侧主补丁（BakaSU 走内置 SUSFS 胶水，不打 10_ 补丁）
      # 5.15 上下文修法取自 zzh20188/GKI_KernelSU_SUSFS
      # ------------------------------------------------------------------
      - name: Apply SUSFS patch (in-kernel)
        working-directory: kernel
        run: |
          set -euo pipefail
          SUSFS=susfs4ksu
          P50="$SUSFS/kernel_patches/50_add_susfs_in_gki-${ANDROID_VER}-${KERNEL_VER}.patch"

          echo "[1/5] 复制源文件"
          cp "$SUSFS/kernel_patches/fs/"* fs/
          cp "$SUSFS/kernel_patches/include/linux/"* include/linux/
          ls -l fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
          echo "SUSFS_VERSION: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"

          echo "[2/5] 5.15-LTS 上下文临时调整（打完还原）"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            echo "  - 已临时移除 fs/namespace.c 的 trace/hooks/blk.h"
          fi
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            echo "  - 已临时移除 fs/proc/task_mmu.c 的 trace/hooks/mm.h"
          fi

          echo "[3/5] 内核侧主补丁（50_）"
          patch -p1 --no-backup-if-mismatch < "$P50"

          REJ=$(find . -name '*.rej' -not -path './susfs4ksu/*' -not -path './.git/*' | wc -l)
          if [ "$REJ" != "0" ]; then
            echo "::error::SUSFS 补丁产生了 $REJ 个 .rej，集成不完整"
            find . -name '*.rej' -not -path './susfs4ksu/*' -not -path './.git/*' -exec sh -c 'echo "---- {} ----"; cat "{}"' \;
            exit 1
          fi
          echo "  - 零 .rej ✓"

          echo "[4/5] 还原临时上下文调整"
          grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c || sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
          grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c || sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
          echo "  namespace.c blk.h 行数: $(grep -c '^#include <trace/hooks/blk.h>$' fs/namespace.c)"
          echo "  task_mmu.c mm.h  行数: $(grep -c '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c)"

          echo "[5/5] 落点校验（与 BakaSU kernel/tools/inline_hook_check.mk 的契约一致）"
          grep -q "susfs.o" fs/Makefile || { echo "::error::fs/Makefile 没挂上 susfs.o"; exit 1; }
          grep -q "CONFIG_KSU_SUSFS" fs/namei.c || { echo "::error::fs/namei.c 没有 SUSFS 钩子"; exit 1; }
          while IFS=: read -r f h; do
            grep -q "$h" "$f" || { echo "::error::$f 缺 $h（BakaSU inline_hook_check 会直接 error）"; exit 1; }
            echo "  - $f 有 $h ✓"
          done <<'EOF'
          kernel/sys.c:ksu_handle_setresuid
          fs/exec.c:ksu_handle_execveat
          fs/open.c:ksu_handle_faccessat
          fs/read_write.c:ksu_handle_sys_read
          fs/stat.c:ksu_handle_stat
          kernel/reboot.c:ksu_handle_sys_reboot
          drivers/input/input.c:ksu_handle_input_handle_event
          EOF
          # 旧版钩子名若残留，BakaSU 同样会 error；这里提前给出更清晰的报错
          for old in ksu_vfs_read_hook ksu_input_hook ksu_execveat_hook ksu_init_rc_hook; do
            if grep -rqs "$old" fs/read_write.c drivers/input/input.c fs/exec.c fs/stat.c; then
              echo "::error::检测到不兼容的旧钩子 $old（SUSFS 补丁与 BakaSU 契约不匹配）"
              exit 1
            fi
          done
          echo "已修改的 tracked 文件数: $(git status --porcelain | wc -l)"

      - name: Prepare Defconfig
        working-directory: kernel
        run: |
          set -euo pipefail
          DEF=arch/arm64/configs/gki_defconfig
          cp "$DEF" "$DEF.orig"
          # KSU_SUSFS 在 BakaSU 的 Kconfig 里与 KSU_TRACEPOINT_HOOK 同属一个 choice，
          # 显式选 SUSFS inline hook（等价于同时关掉 tracepoint / manual hook）
          grep -q '^CONFIG_KSU=y' "$DEF" || echo 'CONFIG_KSU=y' >> "$DEF"
          grep -q '^CONFIG_KSU_SUSFS=y' "$DEF" || echo 'CONFIG_KSU_SUSFS=y' >> "$DEF"
          grep -q '^CONFIG_WERROR=n' "$DEF" || echo 'CONFIG_WERROR=n' >> "$DEF"

          export PATH="$CCACHE_WRAPPER_DIR:$CLANG_BIN_DIR:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "[+] 关键配置项："
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KSU_SUSFS_[A-Z_]+|KSU_TRACEPOINT_HOOK|KSU_MANUAL_HOOK|THREAD_INFO_IN_TASK|KPROBES|KALLSYMS_ALL|EXT4_FS|MODULES|WERROR|LTO_CLANG_THIN|CFI_CLANG)=' out/.config || true
          for c in CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^${c}=y" out/.config || { echo "::error::$c 未生效（依赖不满足时 olddefconfig 会静默丢掉）"; exit 1; }
          done
          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config; then
            echo "::error::KSU_SUSFS 与 KSU_TRACEPOINT_HOOK 同时为 y（choice 不应出现）"
            exit 1
          fi

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="$CCACHE_WRAPPER_DIR:$CLANG_BIN_DIR:$PATH"
          echo "编译内核（$(clang --version | head -n1)）"
          ccache -z
          START=$(date -u +%s)
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image Image.gz 2>&1 | tee out/build.log
          if [ "$BUILD_MODULES" = "true" ]; then
            make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules 2>&1 | tee -a out/build.log
          fi
          echo "编译耗时: $(( ($(date -u +%s) - START) / 60 )) 分钟"
          ccache -s | head -20

      - name: Verify Kernel Image
        working-directory: kernel
        run: |
          set -euo pipefail
          test -f out/arch/arm64/boot/Image || { echo "::error::没生成 Image"; exit 1; }
          ls -lh out/arch/arm64/boot/Image*
          strings out/arch/arm64/boot/Image > "$RUNNER_TEMP/image.strings"
          echo "[+] 版本串："; grep -m1 '^Linux version' "$RUNNER_TEMP/image.strings" || true
          echo "[+] kernel.release: $(cat out/include/config/kernel.release)"
          echo "[+] BakaSU/KernelSU 痕迹："; grep -m5 -iE 'BakaSU|KernelSU' "$RUNNER_TEMP/image.strings" || echo "::warning::Image 里没搜到 KSU 字符串"
          echo "[+] SUSFS 痕迹："; grep -m5 -i 'susfs' "$RUNNER_TEMP/image.strings" || echo "::warning::Image 里没搜到 susfs 字符串（可能被优化掉，以 config 为准）"
          for c in CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^${c}=y" out/.config || { echo "::error::$c 不是 y"; exit 1; }
          done
          REJ=$(find . -name '*.rej' -not -path './susfs4ksu/*' -not -path './.git/*' | wc -l)
          [ "$REJ" = "0" ] || { echo "::error::构建后仍有 $REJ 个 .rej"; exit 1; }
          {
            echo "KERNEL_RELEASE=$(cat out/include/config/kernel.release)"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LINUX_VERSION_STR=$(grep -m1 '^Linux version' "$RUNNER_TEMP/image.strings" || true)"
            echo "IMAGE_SIZE=$(stat -c%s out/arch/arm64/boot/Image)"
            echo "IMAGE_SHA256=$(sha256sum out/arch/arm64/boot/Image | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
          {
            echo "BakaSU        : Baka-SU/BakaSU ${KSU_REF} (${KSU_COMMIT:-})"
            echo "SUSFS         : simonpunk/susfs4ksu ${SUSFS_BRANCH} @ ${SUSFS_COMMIT:-}"
            echo "50_ patch md5 : ${SUSFS_50_MD5:-}"
            echo "补丁文件      : fs/susfs.c, include/linux/susfs.h, include/linux/susfs_def.h"
            echo "KSU 侧补丁    : 无（BakaSU 自带 CONFIG_KSU_SUSFS 胶水）"
            echo ".rej 数量     : 0（集成步骤已断言）"
            echo "装机后        : 需用 userspace 工具 ksu_susfs 配置 sus_path / sus_mount 等"
          } | tee out/susfs-patch-info.txt

      - name: Package AnyKernel3
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ ! -d anykernel_template ]; then
            echo "::warning::没有 anykernel_template，跳过打包"; exit 0
          fi
          AK3_DIR="$RUNNER_TEMP/ak3"
          rm -rf "$AK3_DIR"
          cp -r anykernel_template "$AK3_DIR"
          cp out/arch/arm64/boot/Image "$AK3_DIR/Image"
          LABEL="GKI 5.15 + BakaSU ${KSU_DESCRIBE:-} + SUSFS(in-kernel)"
          sed -i "s|^kernel.string=.*|kernel.string=$LABEL|" "$AK3_DIR/anykernel.sh" || true
          sed -i "s|^build.date=.*|build.date=$(date -u +%Y-%m-%d)|" "$AK3_DIR/anykernel.sh" || true
          grep -E '^(kernel\.string|device\.name1|build\.date)=' "$AK3_DIR/anykernel.sh" || true
          ( cd "$AK3_DIR" && zip -r -q "$GITHUB_WORKSPACE/kernel/out/anykernel.zip" . )
          ls -lh out/anykernel.zip

      - name: Write Build Info
        working-directory: kernel
        run: |
          {
            echo "======================================================"
            echo " GKI 5.15 + BakaSU + SUSFS(in-kernel) build info"
            echo "======================================================"
            echo "repo commit    : $GITHUB_SHA"
            echo "workflow run   : $GITHUB_RUN_ID"
            echo "BakaSU         : ${KSU_REF} (${KSU_COMMIT:-})"
            echo "SUSFS          : ${SUSFS_BRANCH} @ ${SUSFS_COMMIT:-}"
            echo "SUSFS 50_ md5  : ${SUSFS_50_MD5:-}"
            echo "kernel release : ${KERNEL_RELEASE:-}"
            echo "linux version  : ${LINUX_VERSION_STR:-}"
            echo "Image sha256   : ${IMAGE_SHA256:-}"
            echo "build time     : ${BUILD_TIME:-}"
            echo "toolchain      : $( "$CLANG_BIN_DIR/clang" --version | head -n1 )"
            echo "======================================================"
          } | tee out/build-info.txt
          cp out/.config out/kernel-config.txt

          # 产物只保留 anykernel.zip：把构建信息/内核配置/SUSFS 补丁信息一并塞进包里
          if [ -f out/anykernel.zip ]; then
            zip -j -q out/anykernel.zip out/build-info.txt out/kernel-config.txt || true
            if [ -f out/susfs-patch-info.txt ]; then
              zip -j -q out/anykernel.zip out/susfs-patch-info.txt || true
            fi
            echo "[+] AK3 包内容："
            unzip -l out/anykernel.zip | tail -28
          fi

      # 产物只保留 AnyKernel3 打包结果（Image / 构建信息 / 内核配置 / SUSFS 补丁信息都已打进 anykernel.zip）
      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: GKI-5.15-BakaSU-SUSFS-${{ inputs.bakasu_ref }}-anykernel3
          path: kernel/out/anykernel.zip
          if-no-files-found: error
          retention-days: 30

      # 编译日志只在失败时上传，成功时不占产物配额
      - name: Upload Build Logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            kernel/out/build.log
            kernel/out/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: ccache Statistics
        if: always()
        run: |
          echo "=== ccache 统计 ==="
          ccache -s || true
          du -sh "$CCACHE_DIR" 2>/dev/null || true

name: Build GKI with KernelSU

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours timeout for kernel build

    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: android_gki_kernel_5.15_common
        submodules: recursive

    - name: Free Disk Space
      run: |
        echo "Freeing up disk space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /usr/local/lib/android
        sudo docker image prune --all --force || true
        df -h

    - name: Setup Swap
      run: |
        echo "Setting up swap space..."
        sudo fallocate -l 8G /swapfile2
        sudo chmod 600 /swapfile2
        sudo mkswap /swapfile2
        sudo swapon /swapfile2
        sudo swapon --show
        echo "Swap setup complete"

    - name: Install Dependencies
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y git zip unzip curl wget python3 bc rsync schedtool \
          cpio ncurses-dev libxml2-utils inetutils-ping build-essential python3-pip \
          flex bison libssl-dev libelf-dev python3-venv lm-sensors

        # Install mkbootimg from AOSP source
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg
        cd mkbootimg
        sudo install -m 0755 mkbootimg.py /usr/local/bin/mkbootimg
        cd ..

        # Install Repo tool
        mkdir -p ~/.bin
        REPO_URL="https://storage.googleapis.com/git-repo-downloads/repo"
        curl -o ~/.bin/repo "$REPO_URL"
        chmod a+rx ~/.bin/repo
        echo "$HOME/.bin" >> $GITHUB_PATH
        
    - name: 设定 CONFIG 环境变量
      run: |
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

        # Install ccach
    - name: 安装 ccache
      run: sudo apt update && sudo apt upgrade -y && sudo apt install -y ccache python3 git curl clang
      
    - name: 配置 ccache
      run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
    - name: 从缓存中还原ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

    - name: Prepare Workspace Directory
      run: |
        # 创建 workspace 目录结构，以便缓存能正确恢复
        mkdir -p gki_build_workspace/prebuilts/clang/host/linux-x86
        mkdir -p gki_build_workspace/.repo
        mkdir -p gki_build_workspace/build
        mkdir -p gki_build_workspace/tools

    - name: Cache Repo Sync
      uses: actions/cache@v4
      with:
        path: |
          gki_build_workspace/.repo
          gki_build_workspace/prebuilts
          gki_build_workspace/build
          gki_build_workspace/tools
        key: ${{ runner.os }}-repo-sync-v1
        restore-keys: |
          ${{ runner.os }}-repo-sync-

    - name: Run Build Script (with KernelSU)
      run: |
        cd android_gki_kernel_5.15_common
        chmod +x build_gki.sh
        # 运行构建脚本，启用 KernelSU 支持
        # 设置 Bazel 资源限制以防止 OOM
        export BAZEL_FLAGS="--local_ram_resources=10240 --local_cpu_resources=4"
        ./build_gki.sh --ksu

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GKI-Kernel-5.15-KernelSU
        path: |
          android_gki_kernel_5.15_common/out/*
        retention-days: 30
